<svg xmlns="http://www.w3.org/2000/svg" viewBox="-114 -986 2053 1206" width="520" role="img" aria-label="Tablewright">
  <title>Tablewright</title>
  <desc>
    The T and W of Cinzel Decorative as outlines rather than as text, lifted
    once from packages/ui/fonts/cinzel-decorative-700.woff2. The W is set at
    the T's shoulder, where its swash carries over the top.

    This is the copy to open and to work on. The app paints its own, inline
    in apps/table/index.html, because a loader that has to fetch a file is a
    loader that has to wait for one. If these two paths change, that copy
    changes with them.

    Drawn here as the app draws it: once, then held. For a still wordmark,
    drop the style block and give the paths a fill.
  </desc>
  <style>
    path {
      fill: none;
      stroke: #c9a24e;
      stroke-width: 14;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      animation: draw 1150ms ease-in-out forwards;
    }
    path + path {
      animation-delay: 180ms;
    }
    @keyframes draw {
      to {
        stroke-dashoffset: 0;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      path {
        animation: none;
        stroke-dashoffset: 0;
      }
    }
  </style>
