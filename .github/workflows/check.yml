# Ready for the day the repository gets a remote; untested until then, since
# the project is local-only by design (see .ai/CLAUDE.md).
name: check

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Tauri Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: Swatinem/rust-cache@v2
      - run: bun install --frozen-lockfile
      - run: bun run check

  # Informational only: hosted runners render in software, so the numbers are
  # not comparable to a real GPU and cannot gate. The job fails only on a
  # collapse, and uploads the report for inspection.
  perf:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run perf -- --ci --report=perf-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-report
          path: perf-report.json
          if-no-files-found: ignore
