<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tablewright Table</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #14151a;
        color: #c9c7c0;
        font:
          14px system-ui,
          sans-serif;
      }
      #board {
        position: fixed;
        inset: 0;
      }
      #board > canvas {
        display: block;
      }
      #board[data-camera="pan-ready"] {
        cursor: grab;
      }
      #board[data-camera="panning"] {
        cursor: grabbing;
      }
      .fatal {
        position: fixed;
        inset: auto 0 0 0;
        margin: 0;
        padding: 12px 16px;
        background: #3a1d1d;
        color: #f0c8c8;
      }
    </style>
  </head>
  <body>
    <div id="board"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
