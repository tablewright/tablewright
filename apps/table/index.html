<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tablewright Table</title>
    <style>
      html,
      body {
        height: 100%;
        overflow: hidden;
      }
      #board {
        position: fixed;
        inset: 0;
      }
      #board > canvas {
        display: block;
      }
      #board[data-camera="panning"] {
        cursor: grabbing;
      }
      .fatal {
        position: fixed;
        inset: auto 0 0 0;
        margin: 0;
        padding: var(--tw-comp-notice-error-padding);
        background: var(--tw-comp-notice-error-background-color);
        color: var(--tw-comp-notice-error-text-color);
        font-size: var(--tw-comp-notice-error-font-size);
        line-height: var(--tw-comp-notice-error-line-height);
      }
    </style>
  </head>
  <body>
    <div id="board"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
