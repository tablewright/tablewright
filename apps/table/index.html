<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tablewright Table</title>
    <style>
      html,
      body {
        height: 100%;
        overflow: hidden;
      }
      #board {
        position: fixed;
        inset: 0;
        /* The board owns every gesture; the browser must not scroll, pinch, or select here. */
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }
      #board > canvas {
        display: block;
      }
      #board[data-camera="panning"] {
        cursor: grabbing;
      }
      .chrome {
        position: fixed;
        top: var(--tw-space-md);
        left: var(--tw-space-md);
        display: flex;
        gap: var(--tw-space-sm);
      }
      .chrome button {
        background: var(--tw-comp-button-quiet-background-color);
        color: var(--tw-comp-button-quiet-text-color);
        font-family: var(--tw-comp-button-quiet-font-family);
        font-size: var(--tw-comp-button-quiet-font-size);
        font-weight: var(--tw-comp-button-quiet-font-weight);
        line-height: var(--tw-comp-button-quiet-line-height);
        letter-spacing: var(--tw-typo-label-md-letter-spacing);
        padding: var(--tw-comp-button-quiet-padding) var(--tw-space-md);
        border: 1px solid var(--tw-outline);
        border-radius: var(--tw-comp-button-quiet-rounded);
        cursor: pointer;
      }
      .chrome button:hover {
        background: var(--tw-surface-container-highest);
      }
      .chrome button:focus-visible {
        outline: 2px solid var(--tw-focus-ring);
        outline-offset: 2px;
      }
      .notice {
        position: fixed;
        inset: auto 0 0 0;
        margin: 0;
        padding: var(--tw-comp-notice-error-padding);
        background: var(--tw-comp-notice-error-background-color);
        color: var(--tw-comp-notice-error-text-color);
        font-size: var(--tw-comp-notice-error-font-size);
        line-height: var(--tw-comp-notice-error-line-height);
      }
      .notice[data-level="error"] {
        cursor: pointer;
      }
      .notice[data-level="info"] {
        background: var(--tw-surface-container-high);
        color: var(--tw-on-surface);
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="board"></div>
    <div class="chrome">
      <button id="open-map" type="button">Open map</button>
      <button id="search" type="button">Search</button>
    </div>
    <!-- Mounted once and hidden, so Ctrl+Space costs nothing but a class change. -->
    <tw-spotlight></tw-spotlight>
    <!-- Shared entries queue here, one card at a time; an entry opens as a page. -->
    <tw-share-tray></tw-share-tray>
    <tw-entry-view></tw-entry-view>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
